<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>烟花祝福</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }        body {
            overflow: hidden;
            background: linear-gradient(to bottom, #0c1445 0%, #1a237e 50%, #283593 100%);
            font-family: 'Arial', sans-serif;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .name-container {
            position: fixed;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .greeting {
            font-size: 2rem;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.6);
            margin-bottom: 1rem;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .name {
            font-size: 1.8rem;
            font-weight: 300;
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #ffd700 0%, #ff69b4 50%, #87ceeb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 20px rgba(255, 105, 180, 0.6));
            letter-spacing: 0.2em;
            font-style: italic;
            animation: shimmer 3s ease-in-out infinite, colorShift 5s ease-in-out infinite;
        }

        @keyframes colorShift {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 20px rgba(255, 105, 180, 0.6));
            }
            33% {
                filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.8)) drop-shadow(0 0 20px rgba(138, 43, 226, 0.6));
            }
            66% {
                filter: drop-shadow(0 0 10px rgba(138, 43, 226, 0.8)) drop-shadow(0 0 20px rgba(0, 255, 255, 0.6));
            }
        }

        .blessing {
            font-size: 1.3rem;
            color: #87ceeb;
            text-shadow: 0 0 10px rgba(135, 206, 235, 0.7);
            margin-top: 1.5rem;
            animation: fadeInOut 4s ease-in-out infinite;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.6);
            }
            to {
                text-shadow: 0 0 20px rgba(255, 215, 0, 1), 0 0 40px rgba(255, 215, 0, 0.8), 0 0 60px rgba(255, 215, 0, 0.6);
            }
        }

        @keyframes shimmer {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.05);
            }
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <canvas id="canvas"></canvas>
    <div class="name-container">
        <div class="greeting"></div>
        <div class="name" id="name">珍妮</div>
        <div class="blessing">愿你每一天都灿烂如烟花 🎆</div>
    </div>

    <script>
            // 配置区域 - 可以自定义这些内容..
            const CONFIG = {
                name: "珍妮", // 这里修改名字
                greeting: "", // 这里修改问候语
                blessing: "女神节快乐🌸愿你每一天都灿烂如烟花 🎇", // 这里修改祝福语
                autoFireInterval: 800, // 自动发射烟花的间隔时间（毫秒）
                particleCount: 350, // 每个烟花的粒子数量
                particleSpeed: 5, // 粒子速度
                gravity: 0.03, // 重力
                friction: 0.98 // 摩擦力
            };

            // 更新显示的文本
                                        document.getElementById('name').textContent = 'To：' + CONFIG.name;
            document.querySelector('.greeting').textContent = CONFIG.greeting;
            document.querySelector('.blessing').textContent = CONFIG.blessing;

            const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
            let width, height;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
        }
            resize();
            window.addEventListener('resize', resize);

            // 创建星星背景
            function createStars() {
                const starsContainer = document.getElementById('stars');
                starsContainer.innerHTML = '';
                for (let i = 0; i < 100; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 60 + '%';
                    star.style.width = Math.random() * 3 + 1 + 'px';
                    star.style.height = star.style.width;
                    star.style.animationDelay = Math.random() * 2 + 's';
                    starsContainer.appendChild(star);
                }
            }
            createStars();

            // 烟花粒子类
        class Particle {
            constructor(x, y, color, vx, vy) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
                this.size = Math.random() * 3 + 1;
                this.trail = [];
                this.maxTrailLength = 5;
            }

            update() {
                this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
                if (this.trail.length > this.maxTrailLength) {
                    this.trail.shift();
                }

                this.vx *= CONFIG.friction;
                this.vy *= CONFIG.friction;
                this.vy += CONFIG.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                for (let i = 0; i < this.trail.length; i++) {
                    const trail = this.trail[i];
                    const trailAlpha = (i / this.trail.length) * trail.alpha * 0.5;
                    ctx.beginPath();
                    ctx.arc(trail.x, trail.y, this.size * (i / this.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = this.color.replace('1)', `${trailAlpha})`);
                    ctx.fill();
                }

                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

            // 烟花类
            class Firework {
                constructor(x, y, targetY, type = 'normal') {
                    this.x = x;
                    this.y = y;
                    this.targetY = targetY;
                    this.speed = 10;
                    this.angle = Math.atan2(targetY - y, x - x);
                    this.vx = Math.cos(this.angle) * this.speed;
                    this.vy = Math.sin(this.angle) * this.speed;
                    this.particles = [];
                    this.exploded = false;
                    this.color = this.getRandomColor();
                    this.trail = [];
                    this.type = type;
                    this.secondExploded = false;
                }

                getRandomColor() {
                    const colors = [
                        'rgba(255, 105, 180, 1)', // 粉色
                        'rgba(255, 215, 0, 1)',    // 金色
                        'rgba(100, 149, 237, 1)',  // 蓝色
                        'rgba(255, 69, 0, 1)',     // 橙红色
                        'rgba(138, 43, 226, 1)',   // 紫色
                        'rgba(0, 255, 255, 1)',    // 青色
                        'rgba(255, 255, 255, 1)',  // 白色
                        'rgba(0, 255, 127, 1)'     // 绿色
                    ];
                    return colors[Math.floor(Math.random() * colors.length)];
                }

                update() {
                    if (!this.exploded) {
                        this.trail.push({ x: this.x, y: this.y });
                        if (this.trail.length > 10) {
                            this.trail.shift();
                        }

                        this.x += this.vx;
                        this.y += this.vy;
                        this.vy += CONFIG.gravity * 0.5;

                        if (this.y <= this.targetY || this.vy >= 0) {
                            this.explode();
                        }
                    } else {
                        for (let i = this.particles.length - 1; i >= 0; i--) {
                            this.particles[i].update();
                            if (this.particles[i].alpha <= 0) {
                                this.particles.splice(i, 1);
                            }
                        }

                        if (this.type === 'double' && !this.secondExploded && this.particles.length < CONFIG.particleCount * 0.3) {
                            this.secondExplode();
                        }
                    }
                }

                explode() {
                    this.exploded = true;

                    switch (this.type) {
                        case 'heart':
                            this.createHeartExplosion();
                            break;
                        case 'star':
                            this.createStarExplosion();
                            break;
                        case 'spiral':
                            this.createSpiralExplosion();
                            break;
                        case 'double':
                            this.createNormalExplosion();
                            break;
                        default:
                            this.createNormalExplosion();
                    }
                }

                createNormalExplosion() {
                    for (let i = 0; i < CONFIG.particleCount; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * CONFIG.particleSpeed + 2;
                        const vx = Math.cos(angle) * speed;
                        const vy = Math.sin(angle) * speed;
                        this.particles.push(new Particle(this.x, this.y, this.color, vx, vy));
                    }
                }

                createHeartExplosion() {
                    const count = CONFIG.particleCount;
                    for (let i = 0; i < count; i++) {
                        const t = (i / count) * Math.PI * 2;
                        const scale = 0.15;
                        const hx = 16 * Math.pow(Math.sin(t), 3);
                        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                        const vx = hx * scale;
                        const vy = hy * scale;
                        this.particles.push(new Particle(this.x, this.y, this.color, vx, vy));
                    }
                }

                createStarExplosion() {
                    const points = 5;
                    const count = CONFIG.particleCount;
                    for (let i = 0; i < count; i++) {
                        const angle = (i / count) * Math.PI * 2;
                        const starAngle = angle * points;
                        const radius = (Math.abs(Math.sin(starAngle)) * 0.5 + 0.5) * CONFIG.particleSpeed + 2;
                        const vx = Math.cos(angle) * radius;
                        const vy = Math.sin(angle) * radius;
                        this.particles.push(new Particle(this.x, this.y, this.color, vx, vy));
                    }
                }

                createSpiralExplosion() {
                    const count = CONFIG.particleCount;
                    const arms = 3;
                    for (let i = 0; i < count; i++) {
                        const angle = (i / count) * Math.PI * 2 * arms;
                        const radius = (i / count) * CONFIG.particleSpeed + 2;
                        const vx = Math.cos(angle) * radius;
                        const vy = Math.sin(angle) * radius;
                        this.particles.push(new Particle(this.x, this.y, this.color, vx, vy));
                    }
                }

                secondExplode() {
                    this.secondExploded = true;
                    const secondColor = this.getRandomColor();
                    for (let i = 0; i < CONFIG.particleCount * 0.5; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * CONFIG.particleSpeed * 0.8 + 1;
                        const vx = Math.cos(angle) * speed;
                        const vy = Math.sin(angle) * speed;
                        this.particles.push(new Particle(this.x, this.y, secondColor, vx, vy));
                    }
                }

                draw() {
                    if (!this.exploded) {
                        for (let i = 0; i < this.trail.length; i++) {
                            const trail = this.trail[i];
                            const alpha = i / this.trail.length;
                            ctx.beginPath();
                            ctx.arc(trail.x, trail.y, 2, 0, Math.PI * 2);
                            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                            ctx.fill();
                        }

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffffff';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    this.particles.forEach(particle => particle.draw());
                }
            }

            isDead() {
                return this.exploded && this.particles.length === 0;
            }
        }

            const fireworks = [];
                                        const fireworkTypes = ['normal', 'heart', 'star', 'spiral', 'double'];

            // 自动发射烟花
            function autoFire() {
                const x = Math.random() * (width * 0.6) + width * 0.2;
                const y = height;
                const targetY = Math.random() * (height * 0.4) + height * 0.1;
                const type = fireworkTypes[Math.floor(Math.random() * fireworkTypes.length)];
                fireworks.push(new Firework(x, y, targetY, type));
            }

            setInterval(autoFire, CONFIG.autoFireInterval);

            // 点击发射烟花
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const startY = height;
                const firework = new Firework(x, startY, y);
                fireworks.push(firework);
            });

            // 触摸支持
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                const startY = height;
                const firework = new Firework(x, startY, y);
                fireworks.push(firework);
            });

        // 动画循环
        function animate() {
            ctx.fillStyle = 'rgba(12, 20, 69, 0.2)';
            ctx.fillRect(0, 0, width, height);

            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if (fireworks[i].isDead()) {
                    fireworks.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

    // 初始发射几个烟花
    setTimeout(() => {
        for (let i = 0; i < 3; i++) {
            setTimeout(() => autoFire(), i * 300);
        }
    }, 500);
    </script>
</body>
</html>
